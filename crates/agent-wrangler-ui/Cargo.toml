[package]
name = "agent-wrangler-ui"
version.workspace = true
edition.workspace = true
description = "The rows a client draws and the cells they land in, told apart from the client drawing them"

[dependencies]
# Ratatui's core alone: the buffer, the styles, the text and the widget trait,
# with no backend and no terminal behind any of it. That is what lets one
# drawing compile into the zellij plugin, whose only way out is a string of
# escape sequences, and into a client sitting on a real terminal, where a
# backend takes the same cells there directly.
ratatui-core = { version = "0.1", default-features = false, features = ["std"] }
# The types and a JSON reader. A row that is open reads its preview out of the
# raw transcript records that the daemon handed it. Nothing here goes looking
# for a file, so the feature that reads an agent's files stays off.
agent-wrangler-core = { path = "../agent-wrangler-core", default-features = false, features = [
    "json",
] }
# The scrolling. The dashboard grows taller than the pane as soon as one row
# opens. The whole table then draws into a buffer of its own height, and this
# clips that buffer to the pane. It takes the same `ratatui-core` 0.1 and it
# brings `ratatui-widgets`. It brings no backend and no terminal.
tui-scrollview = "0.6"
# The markdown. An agent answers in markdown, so the message under an open row
# arrives with headings, lists, fences and inline emphasis in it. This parses
# that and returns the same `ratatui-core` 0.1 text that the rows are drawn
# from, so no second drawing path appears.
#
# `highlight-code` is a default feature, and it is off here. It pulls syntect
# and thirty four other crates, it renders through escape sequences that this
# crate would have to read back, and it paints in colors that the sidebar keeps
# for what a row is and whose turn it is.
tui-markdown = { version = "0.3", default-features = false }
