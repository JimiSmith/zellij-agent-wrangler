[package]
name = "agent-wrangler-core"
version.workspace = true
edition.workspace = true
description = "What an agent session is, told apart from whatever draws it"

# Two features, because a client and the daemon need different halves.
#
# `json` turns on the parser alone. A client is handed records and reads them.
# It goes looking for no file, so it takes this one and stays off the disk.
#
# `native` turns on reading an agent's own files, and takes `json` with it,
# because the reader parses those files with it.
[features]
default = ["native"]
json = ["dep:serde", "dep:serde_json"]
native = ["json"]

[dependencies]
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true, features = ["preserve_order"] }
