[package]
name = "zellij-agent-wrangler"
version.workspace = true
edition.workspace = true
description = "A zellij sidebar listing tabs, panes and agent sessions (prototype)"

[lib]
name = "zellij_agent_wrangler"
path = "src/lib.rs"

# The plugin calls zellij's host functions, which exist only inside the wasm
# host, so it is built for that target and tested through the library.
[[bin]]
name = "zellij-agent-wrangler"
path = "src/main.rs"
test = false

[dependencies]
zellij-tile = "0.44.3"
# The types and a JSON reader. The sidebar is handed transcript records and
# reads them where it draws. It goes looking for no file, so it leaves the
# feature that reads an agent's files switched off.
agent-wrangler-core = { path = "../agent-wrangler-core", default-features = false, features = [
    "json",
] }
agent-wrangler-sidebar = { path = "../agent-wrangler-sidebar" }
# What the sidebar draws, shared by the portable application and this adapter's
# ANSI output boundary.
agent-wrangler-ui = { path = "../agent-wrangler-ui" }
