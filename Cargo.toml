[package]
name = "zellij-agent-wrangler"
version = "0.1.0"
edition = "2021"
description = "A zellij sidebar listing tabs, panes and agent sessions (prototype)"

[lib]
name = "zellij_agent_wrangler"
path = "src/lib.rs"

# The plugin itself calls zellij's host functions, which exist only inside the
# wasm host, so it is built for that target and tested through the library.
[[bin]]
name = "zellij-agent-wrangler"
path = "src/main.rs"
test = false

# The hook client runs as an ordinary process beside the agent that invokes it.
# Its feature is what keeps it, and the JSON it reads, out of the wasm.
[[bin]]
name = "zellij-wrangler"
path = "src/wrangler.rs"
required-features = ["native"]

[features]
default = ["native"]
native = ["dep:serde_json"]

[dependencies]
zellij-tile = "0.44.3"
serde_json = { version = "1", optional = true, features = ["preserve_order"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
