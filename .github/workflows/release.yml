name: release

# The two halves are released together and named for the same tag. That is what
# lets a layout pin the plugin to the version of the client that is installed:
# zellij caches a downloaded plugin under the last segment of its url and never
# re-fetches a name it already holds, so a wasm named for its version is the only
# kind an update can actually replace.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  release:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Open the release this tag names
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "$GITHUB_REF_NAME" --generate-notes

  plugin:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-wasip1
      - name: Build the plugin
        run: |
          cargo build --release --locked --target wasm32-wasip1 \
            -p zellij-agent-wrangler
      - name: Attach it, named for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/wasm32-wasip1/release/zellij-agent-wrangler.wasm \
            "zellij-agent-wrangler-$GITHUB_REF_NAME.wasm"
          gh release upload "$GITHUB_REF_NAME" \
            "zellij-agent-wrangler-$GITHUB_REF_NAME.wasm" --clobber

  client:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-13
            target: x86_64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: .exe
    runs-on: ${{ matrix.runner }}
    # The upload step is written for a POSIX shell, which the Windows runner
    # also has; naming it keeps one script for every platform in the matrix.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - name: Build the client and the daemon
        run: |
          cargo build --release --locked --target ${{ matrix.target }} \
            -p agent-wrangler
      - name: Attach it, named for this tag and its platform
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="agent-wrangler-$GITHUB_REF_NAME-${{ matrix.target }}${{ matrix.suffix }}"
          cp "target/${{ matrix.target }}/release/agent-wrangler${{ matrix.suffix }}" "$asset"
          gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
