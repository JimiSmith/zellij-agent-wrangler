name: release

# The two halves go out together, and carry the name of the same tag. A layout
# can therefore pin the plugin to the version of the installed client. Zellij
# caches a downloaded plugin under the last segment of its url, and never
# fetches a name that it already holds again. A wasm with its version in the
# name is therefore the only kind that an update can replace.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy rustfmt
      - run: rustup target add wasm32-wasip1
      # `--all` is necessary because the root is a virtual manifest. In a
      # virtual manifest, the plain form covers the default members and not
      # every crate.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The plugin ships as wasm, and no other job builds it that way. The
      # host lint above therefore says nothing about the released artifact.
      - run: >
          cargo clippy -p zellij-agent-wrangler --target wasm32-wasip1
          --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # The native half goes out for Windows, so this job builds it and runs it on
  # Windows before a tag can ship it. A build from Linux catches a great deal.
  # A build from Linux cannot catch the process table, the local socket or the
  # paths at work. The code for each of these is written twice, and every other
  # place tests one copy only.
  #
  # This job does not build the plugin. The plugin is wasm, and off wasm its
  # dependency pulls in the whole of zellij, which is neither wanted nor
  # portable.
  check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy
      - run: cargo clippy -p agent-wrangler -p agent-wrangler-core -p tmux-agent-wrangler --all-targets --locked -- -D warnings
      - run: cargo test -p agent-wrangler -p agent-wrangler-core -p tmux-agent-wrangler --locked

  # The same, for macOS. A different kernel interface on each system answers
  # the question of when a process started. No other job compiles and runs the
  # macOS code for that question. Without this job, the first build of that code
  # happens in the job that attaches the asset, which runs after the release
  # exists.
  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy
      - run: cargo clippy -p agent-wrangler -p agent-wrangler-core -p tmux-agent-wrangler --all-targets --locked -- -D warnings
      - run: cargo test -p agent-wrangler -p agent-wrangler-core -p tmux-agent-wrangler --locked

  release:
    needs: [check, check-windows, check-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # This job opens the release as a draft, and a later job publishes it.
      # Nothing ever sees a release without the platform that it is on. This job
      # leaves an existing draft alone. The job runs again after every re-cut of
      # a tag, and the delete of a tag turns its release back into a draft.
      - name: Open the release this tag names, as a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "$GITHUB_REF_NAME" --generate-notes

  plugin:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-wasip1
      - name: Build the plugin
        run: |
          cargo build --release --locked --target wasm32-wasip1 \
            -p zellij-agent-wrangler
      - name: Attach it, named for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/wasm32-wasip1/release/zellij-agent-wrangler.wasm \
            "zellij-agent-wrangler-$GITHUB_REF_NAME.wasm"
          gh release upload "$GITHUB_REF_NAME" \
            "zellij-agent-wrangler-$GITHUB_REF_NAME.wasm" --clobber

  client:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # Apple silicon builds both mac targets, and cross-compiles the
          # Intel target. The SDK of Apple silicon carries both architectures.
          # The Intel runners are retired, so a label that names one gives a job
          # that waits for a machine that never comes.
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-latest
            target: x86_64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: .exe
    runs-on: ${{ matrix.runner }}
    # The upload step needs a POSIX shell, which the Windows runner also has. A
    # name for the shell keeps one script for every platform in the matrix.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - name: Build the client and the daemon
        run: |
          cargo build --release --locked --target ${{ matrix.target }} \
            -p agent-wrangler
      - name: Attach it, named for this tag and its platform
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="agent-wrangler-$GITHUB_REF_NAME-${{ matrix.target }}${{ matrix.suffix }}"
          cp "target/${{ matrix.target }}/release/agent-wrangler${{ matrix.suffix }}" "$asset"
          gh release upload "$GITHUB_REF_NAME" "$asset" --clobber

      # The same program, linked so that Windows never gives it a console. The
      # hooks and the sidebar run this program on Windows. This job attaches the
      # program for Windows only. Everywhere else the program is the same file
      # as the one above, because only Windows has a console to give.
      - name: Attach the windowless client, which only Windows has a use for
        if: matrix.target == 'x86_64-pc-windows-msvc'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="agent-wranglerw-$GITHUB_REF_NAME-${{ matrix.target }}.exe"
          cp "target/${{ matrix.target }}/release/agent-wranglerw.exe" "$asset"
          gh release upload "$GITHUB_REF_NAME" "$asset" --clobber

  # No step below the release can be half done. The install script asks for the
  # latest release and takes what it finds. A release with some of its platforms
  # is worse than a release with none.
  publish:
    needs: [plugin, client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish it, now that every platform is attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
