name: release

# The two halves are released together and named for the same tag. That is what
# lets a layout pin the plugin to the version of the client that is installed:
# zellij caches a downloaded plugin under the last segment of its url and never
# re-fetches a name it already holds, so a wasm named for its version is the only
# kind an update can actually replace.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy rustfmt
      - run: rustup target add wasm32-wasip1
      # `--all` because the root is a virtual manifest, where the plain form
      # covers the default members rather than every crate.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The plugin ships as wasm and nothing else builds it that way, so the
      # host lint above says nothing about the artifact that is actually
      # released.
      - run: >
          cargo clippy -p zellij-agent-wrangler --target wasm32-wasip1
          --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # The native half is released for Windows, so it is built and run there before
  # a tag can ship one. Compiling it from Linux catches a great deal and cannot
  # catch the process table, the local socket or the paths actually working, all
  # of which are written twice and only tested once anywhere else.
  #
  # The plugin is not built here: it is wasm, and off wasm its dependency pulls
  # in the whole of zellij, which is neither wanted nor portable.
  check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy
      - run: cargo clippy -p agent-wrangler -p agent-wrangler-core --all-targets --locked -- -D warnings
      - run: cargo test -p agent-wrangler -p agent-wrangler-core --locked

  # The same, for macOS. Asking a process when it started is answered by a
  # different kernel interface on each system, so the one written here for macOS
  # is compiled and run nowhere else: without this it would first be built by the
  # job that attaches the asset, which is after the release exists.
  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy
      - run: cargo clippy -p agent-wrangler -p agent-wrangler-core --all-targets --locked -- -D warnings
      - run: cargo test -p agent-wrangler -p agent-wrangler-core --locked

  release:
    needs: [check, check-windows, check-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Opened as a draft and published at the end, so nothing ever sees a
      # release that is missing the platform it is on. A draft that is already
      # there is left alone: this runs again whenever a tag is re-cut, and
      # deleting a tag turns its release back into a draft.
      - name: Open the release this tag names, as a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "$GITHUB_REF_NAME" --generate-notes

  plugin:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-wasip1
      - name: Build the plugin
        run: |
          cargo build --release --locked --target wasm32-wasip1 \
            -p zellij-agent-wrangler
      - name: Attach it, named for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/wasm32-wasip1/release/zellij-agent-wrangler.wasm \
            "zellij-agent-wrangler-$GITHUB_REF_NAME.wasm"
          gh release upload "$GITHUB_REF_NAME" \
            "zellij-agent-wrangler-$GITHUB_REF_NAME.wasm" --clobber

  client:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # Both mac targets are built on Apple silicon, cross-compiling the
          # Intel one. Its SDK carries both architectures, and the Intel runners
          # have been retired, so a label naming one is a job that waits for a
          # machine that is not coming.
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-latest
            target: x86_64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: .exe
    runs-on: ${{ matrix.runner }}
    # The upload step is written for a POSIX shell, which the Windows runner
    # also has; naming it keeps one script for every platform in the matrix.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - name: Build the client and the daemon
        run: |
          cargo build --release --locked --target ${{ matrix.target }} \
            -p agent-wrangler
      - name: Attach it, named for this tag and its platform
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="agent-wrangler-$GITHUB_REF_NAME-${{ matrix.target }}${{ matrix.suffix }}"
          cp "target/${{ matrix.target }}/release/agent-wrangler${{ matrix.suffix }}" "$asset"
          gh release upload "$GITHUB_REF_NAME" "$asset" --clobber

      # The same program linked so that Windows never gives it a console, which
      # is what the hooks and the sidebar run there. It is attached only for
      # Windows because it is the same file as the one above everywhere else:
      # nothing but Windows has a console to be given.
      - name: Attach the windowless client, which only Windows has a use for
        if: matrix.target == 'x86_64-pc-windows-msvc'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="agent-wranglerw-$GITHUB_REF_NAME-${{ matrix.target }}.exe"
          cp "target/${{ matrix.target }}/release/agent-wranglerw.exe" "$asset"
          gh release upload "$GITHUB_REF_NAME" "$asset" --clobber

  # Nothing below the release is allowed to be half done: the install script
  # asks for the latest release and takes what it finds, so a release carrying
  # some of its platforms is worse than one carrying none.
  publish:
    needs: [plugin, client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish it, now that every platform is attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
