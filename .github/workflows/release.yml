name: check and release

# The two halves go out together, and carry the name of the same tag. A layout
# can therefore pin the plugin to the version of the installed client. Zellij
# caches a downloaded plugin under the last segment of its url, and never
# fetches a name that it already holds again. A wasm with its version in the
# name is therefore the only kind that an update can replace.
#
# Every trigger runs the same checks. Only a pushed version tag can publish.
on:
  push:
    tags: ["v*"]
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: toolchain
        run: rustup component add clippy rustfmt
      - id: wasm-target
        run: rustup target add wasm32-wasip1
      # Each check keeps its failure status without suppressing later checks.
      - name: Check formatting
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo fmt --all --check
      - name: Lint every host target
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The host lint does not cover the released wasm artifact.
      - name: Lint the wasm plugin
        if: ${{ !cancelled() && steps.wasm-target.outcome == 'success' }}
        run: >
          cargo clippy -p zellij-agent-wrangler --target wasm32-wasip1
          --all-targets --locked -- -D warnings
      - name: Run every Rust test, including ignored tests and doctests
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo test --workspace --locked --no-fail-fast -- --include-ignored

  # Workspace feature unification enables native. Test the other core modes
  # separately so that native cannot hide a missing feature boundary.
  check-core-features:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimal
            features: ""
          - name: json
            features: "--features json"
    name: core features (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - id: toolchain
        run: rustup component add clippy
      - name: Lint the core feature set
        run: >
          cargo clippy -p agent-wrangler-core --no-default-features
          ${{ matrix.features }} --all-targets --locked -- -D warnings
      - name: Test the core feature set
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: >
          cargo test -p agent-wrangler-core --no-default-features
          ${{ matrix.features }} --locked --no-fail-fast -- --include-ignored

  live:
    name: All Python and live PTY tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        id: checkout
      - name: Install tmux and the pinned Zellij release
        id: multiplexers
        env:
          ZELLIJ_VERSION: 0.45.1
          # Official asset digest from the GitHub release metadata:
          # https://api.github.com/repos/zellij-org/zellij/releases/tags/v0.45.1
          ZELLIJ_SHA256: 40bcc2e03f5d5ae8e054e39f676081fe12ab70871506996ba595834c3718eefc
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux
          archive="$RUNNER_TEMP/zellij.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/zellij-org/zellij/releases/download/v${ZELLIJ_VERSION}/zellij-x86_64-unknown-linux-musl.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ZELLIJ_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/zellij-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/zellij-bin" zellij
          sudo install -m 0755 "$RUNNER_TEMP/zellij-bin/zellij" /usr/local/bin/zellij
          test "$(zellij --version)" = "zellij $ZELLIJ_VERSION"
          tmux -V
      - name: Install the wasm target
        id: wasm-target
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: rustup target add wasm32-wasip1
      - name: Build the native programs used by the harness
        id: native-build
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: cargo build -p agent-wrangler -p tmux-agent-wrangler --locked
      - name: Build the debug wasm used by the harness
        id: wasm-build
        if: ${{ !cancelled() && steps.wasm-target.outcome == 'success' }}
        run: cargo build -p zellij-agent-wrangler --target wasm32-wasip1 --locked
      - name: Run all discovered Python tests and every step script
        if: >
          ${{ !cancelled() && steps.multiplexers.outcome == 'success' &&
              steps.native-build.outcome == 'success' && steps.wasm-build.outcome == 'success' }}
        run: python3 tests/run_all.py
      - name: Upload test logs, summaries, and screen dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-test-results
          path: tests/out/
          if-no-files-found: warn
          retention-days: 14

  # The native half goes out for Windows, so this job builds it and runs it on
  # Windows before a tag can ship it. A build from Linux catches a great deal.
  # A build from Linux cannot catch the process table, the local socket or the
  # paths at work. The code for each of these is written twice, and every other
  # place tests one copy only.
  #
  # This job does not build the plugin. The plugin is wasm, and off wasm its
  # dependency pulls in the whole of zellij, which is neither wanted nor
  # portable.
  check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - id: toolchain
        run: rustup component add clippy
      - name: Lint every native crate
        run: >
          cargo clippy -p agent-wrangler -p agent-wrangler-core
          -p agent-wrangler-ui -p agent-wrangler-sidebar -p tmux-agent-wrangler
          --all-targets --locked -- -D warnings
      # Psmux does not support the pane-local user option this test requires.
      # Keep the exception specific; Linux and macOS run it without a filter.
      - name: Run native tests except the unsupported tmux integration
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: >
          cargo test -p agent-wrangler -p agent-wrangler-core
          -p agent-wrangler-ui -p agent-wrangler-sidebar -p tmux-agent-wrangler
          --locked --no-fail-fast -- --include-ignored
          --skip tmux_location::tests::sidebar_registration_cleans_only_its_pane_and_tolerates_removed_panes

  # The same, for macOS. A different kernel interface on each system answers
  # the question of when a process started. No other job compiles and runs the
  # macOS code for that question. Without this job, the first build of that code
  # happens in the job that attaches the asset, which runs after the release
  # exists.
  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the tmux runtime
        run: brew install tmux && tmux -V
      - id: toolchain
        run: rustup component add clippy
      - name: Lint every native crate
        run: >
          cargo clippy -p agent-wrangler -p agent-wrangler-core
          -p agent-wrangler-ui -p agent-wrangler-sidebar -p tmux-agent-wrangler
          --all-targets --locked -- -D warnings
      - name: Run every native Rust test, including ignored tests and doctests
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: >
          cargo test -p agent-wrangler -p agent-wrangler-core
          -p agent-wrangler-ui -p agent-wrangler-sidebar -p tmux-agent-wrangler
          --locked --no-fail-fast -- --include-ignored

  # This job runs on a push too, and opens nothing there. It runs because
  # `plugin` and `client` name it, and a skipped job skips everything that names
  # it. A checkout and no release is the cheapest way to keep those two building
  # on a push.
  release:
    needs: [check, check-core-features, check-windows, check-macos, live]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # This job opens the release as a draft, and a later job publishes it.
      # Nothing ever sees a release without the platform that it is on. This job
      # leaves an existing draft alone. The job runs again after every re-cut of
      # a tag, and the delete of a tag turns its release back into a draft.
      - name: Open the release this tag names, as a draft
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "$GITHUB_REF_NAME" --generate-notes

  # On a push this job proves that the released artifact still compiles for
  # wasm. No other job builds the plugin that way.
  plugin:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-wasip1
      - name: Build the plugin
        run: |
          cargo build --release --locked --target wasm32-wasip1 \
            -p zellij-agent-wrangler
      - name: Attach it, named for this tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/wasm32-wasip1/release/zellij-agent-wrangler.wasm \
            "zellij-agent-wrangler-$GITHUB_REF_NAME.wasm"
          gh release upload "$GITHUB_REF_NAME" \
            "zellij-agent-wrangler-$GITHUB_REF_NAME.wasm" --clobber

  # On a push this job proves that the client still compiles for every platform
  # that a release ships it to. A target that fails here fails a tag, and a tag
  # is the worst moment to learn it.
  client:
    needs: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # Apple silicon builds both mac targets, and cross-compiles the
          # Intel target. The SDK of Apple silicon carries both architectures.
          # The Intel runners are retired, so a label that names one gives a job
          # that waits for a machine that never comes.
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-latest
            target: x86_64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: .exe
    runs-on: ${{ matrix.runner }}
    # The upload step needs a POSIX shell, which the Windows runner also has. A
    # name for the shell keeps one script for every platform in the matrix.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - name: Build the client and the daemon
        run: |
          cargo build --release --locked --target ${{ matrix.target }} \
            -p agent-wrangler
      - name: Attach it, named for this tag and its platform
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="agent-wrangler-$GITHUB_REF_NAME-${{ matrix.target }}${{ matrix.suffix }}"
          cp "target/${{ matrix.target }}/release/agent-wrangler${{ matrix.suffix }}" "$asset"
          gh release upload "$GITHUB_REF_NAME" "$asset" --clobber

      # The same program, linked so that Windows never gives it a console. The
      # hooks and the sidebar run this program on Windows. This job attaches the
      # program for Windows only. Everywhere else the program is the same file
      # as the one above, because only Windows has a console to give.
      - name: Attach the windowless client, which only Windows has a use for
        if: >
          github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
          matrix.target == 'x86_64-pc-windows-msvc'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="agent-wranglerw-$GITHUB_REF_NAME-${{ matrix.target }}.exe"
          cp "target/${{ matrix.target }}/release/agent-wranglerw.exe" "$asset"
          gh release upload "$GITHUB_REF_NAME" "$asset" --clobber

  # No step below the release can be half done. The install script asks for the
  # latest release and takes what it finds. A release with some of its platforms
  # is worse than a release with none.
  publish:
    needs: [plugin, client]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish it, now that every platform is attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
